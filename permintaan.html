<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Riwayat Permintaan — Ambulan dan Janaiz</title>
    <meta name="description" content="Daftar permintaan ambulans & pengurusan jenazah beserta filter rentang waktu.">

    <!-- di setiap HTML, paling atas -->
    <script src="js/firebase-init.js"></script>
    <script src="js/firebase-client.js"></script>
    <script src="js/store.js"></script>
    <script>
        window.APP_PRE_DATA_SCRIPTS = ['js/geotracker.js', 'js/report.js'];
        window.APP_POST_DATA_SCRIPTS = ['js/permintaan.js'];
    </script>
    <script src="js/bootstrap.js"></script>

    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Google Font Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="app.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen has-bottom-nav">

    <div class="mx-auto w-full max-w-lg px-4 pb-14 md:max-w-2xl">

        <!-- Header -->
        <header class="flex items-start justify-between gap-3 pt-6 pb-5">
            <div class="flex items-center gap-3">
                <div class="bg-amber-600 p-3 rounded-2xl text-white shadow-lg shadow-amber-600/30">
                    <i class="fa-solid fa-clipboard-list text-xl"></i>
                </div>
                <div>
                    <h1 class="font-bold text-base leading-tight text-slate-100">RIWAYAT PERMINTAAN</h1>
                    <p class="text-xs text-slate-400">Markaz Halawatul Iman</p>
                </div>
            </div>
            <a href="index.html" class="btn btn-ghost btn-sm shrink-0">
                <i class="fa-solid fa-arrow-left"></i> Beranda
            </a>
        </header>

        <!-- Filter rentang waktu -->
        <section class="card">
            <div class="flex items-center justify-between gap-2 mb-2">
                <h2 class="text-sm font-bold text-slate-100">
                    <i class="fa-solid fa-calendar-range mr-1.5 text-amber-400"></i>Filter rentang waktu
                </h2>
                <button type="button" id="rangeReset" class="btn btn-ghost btn-sm">
                    <i class="fa-solid fa-rotate-left"></i> Semua
                </button>
            </div>
            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="label" for="rangeFrom">Dari tanggal</label>
                    <input id="rangeFrom" class="input" type="date">
                </div>
                <div>
                    <label class="label" for="rangeTo">Sampai tanggal</label>
                    <input id="rangeTo" class="input" type="date">
                </div>
            </div>

            <!-- Preset cepat -->
            <div class="flex flex-wrap gap-1.5 mt-3" id="rangePresets">
                <button type="button" class="btn btn-ghost btn-sm" data-preset="today">Hari ini</button>
                <button type="button" class="btn btn-ghost btn-sm" data-preset="7">7 hari</button>
                <button type="button" class="btn btn-ghost btn-sm" data-preset="30">30 hari</button>
                <button type="button" class="btn btn-ghost btn-sm" data-preset="thisYear">Tahun ini</button>
            </div>

            <p class="text-[11px] text-slate-500 mt-3" id="rangeInfo">–</p>
        </section>

        <!-- Daftar permintaan -->
        <section class="mt-5">
            <div class="flex items-center justify-between mb-2">
                <h2 class="text-xs font-bold uppercase tracking-wider text-slate-400">Daftar Permintaan</h2>
                <div class="flex items-center gap-1.5 flex-wrap justify-end">
                    <span class="text-[10px] text-slate-500" id="listCount">0 data</span>
                    <button type="button" id="btnExportExcel" class="btn btn-ghost btn-sm" title="Unduh laporan rekap Excel (.xlsx) sesuai filter">
                        <i class="fa-solid fa-file-excel text-emerald-400"></i> Excel
                    </button>
                    <button type="button" id="btnExportPdf" class="btn btn-ghost btn-sm" title="Unduh laporan rekap PDF sesuai filter">
                        <i class="fa-solid fa-file-pdf text-red-400"></i> PDF
                    </button>
                </div>
            </div>

            <div id="requestList" class="space-y-2.5"></div>

            <div id="emptyState" class="hidden text-center py-10">
                <i class="fa-solid fa-inbox text-2xl text-slate-600 block mb-2"></i>
                <p class="text-xs text-slate-500">Tidak ada permintaan pada rentang waktu tersebut.</p>
            </div>
        </section>


        <footer class="mt-8 text-center text-[11px] text-slate-600 leading-relaxed">
            Ambulan dan Janaiz · Markaz Halawatul Iman<br>
            Data permintaan tersimpan di Firestore dan tersinkron antar perangkat.
        </footer>
    </div>

    <!-- Aksi utama mengapung: buat permintaan baru -->
    <a href="index.html#requestForm" class="fab" aria-label="Buat permintaan baru" title="Buat permintaan baru">
        <i class="fa-solid fa-plus" aria-hidden="true"></i>
    </a>

    <!-- Navigasi mengapung -->
    <nav class="bottom-nav" aria-label="Navigasi utama">
        <a href="index.html" class="bottom-nav__item">
            <i class="fa-solid fa-house" aria-hidden="true"></i><span>Beranda</span>
        </a>
        <a href="permintaan.html" class="bottom-nav__item is-active" aria-current="page">
            <i class="fa-solid fa-clipboard-list" aria-hidden="true"></i><span>Riwayat</span>
            <span class="bottom-nav__badge hidden" data-nav-badge="permintaan" aria-hidden="true">0</span>
        </a>
        <a href="login.html" data-nav="auto" class="bottom-nav__item" title="Masuk akun">
            <i class="fa-solid fa-user-shield" aria-hidden="true"></i><span>Akun</span>
        </a>
    </nav>

</body>
</html>
